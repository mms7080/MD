<!DOCTYPE html>
<html lang="ko" data-theme="light" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>팀 참여 정보 – kafolio</title>

    <link rel="stylesheet" th:href="@{/css/header.css}" />
    <link rel="stylesheet" th:href="@{/css/footer.css}" />
    <link rel="stylesheet" th:href="@{/css/mypage/mypage.css}" />
    <link rel="stylesheet" th:href="@{/css/users/auth-modal.css}" />
</head>

<body>
    <!-- 헤더 -->
    <th:block th:replace="fragments/header :: header('mypage')"></th:block>

    <div class="admin-shell">
        <!-- 사이드바 -->
        <aside class="nav-rail">
            <div class="org-name">마이페이지</div>
            <nav class="rail-menu" id="sidebar">
                <a href="/mypage/home" class="rail-item"><span class="dot"></span>홈</a>
                <a href="/mypage/team" class="rail-item is-active"><span class="dot"></span> 팀 참여 정보</a>
                <a href="/mypage/withdraw" class="rail-item"><span class="dot"></span> 회원 탈퇴</a>
            </nav>
        </aside>

        <!-- 메인 -->
        <main class="page">
            <div class="page-header">
                <div class="page-titles">
                    <h1>팀 참여 정보</h1>
                    <p class="sub"
                       th:text="${#lists.isEmpty(teams)} ? '현재 참여 중인 팀이 없습니다.' : '현재 참여 중인 팀 목록입니다.'">
                        현재 참여 중인 팀 목록입니다.
                    </p>
                </div>
            </div>

            <!-- 팀 목록 (단일 표) -->
            <section class="panel">
                <div class="panel-head">
                    <h2>팀 목록</h2>
                </div>
                <div style="padding:16px">
                    <table>
                        <thead>
                            <tr>
                                <!-- 팀명, 생성일, 인원수, 팀원 -->
                                <th style="width:15%">팀명</th>
                                <th style="width:15%">생성일</th>
                                <th style="width:10%">인원수</th>
                                <th style="width:45%">팀원</th>
                            </tr>
                        </thead>

                        <!-- 팀이 하나도 없을 때 -->
                        <tbody th:if="${#lists.isEmpty(teams)}">
                            <tr>
                                <td colspan="4" style="text-align:center;">
                                    현재 참여 중인 팀이 없습니다.
                                </td>
                            </tr>
                        </tbody>

                        <!-- 팀이 있을 때 -->
                        <tbody th:if="${!#lists.isEmpty(teams)}">
                            <tr th:each="team : ${teams}">
                                <!-- 팀명 -->
                                <td>
                                    <!-- 나중에 팀 상세 페이지가 생기면 href 수정 -->
                                    <span
                                       th:text="${team.name}">팀명</span>
                                </td>

                                <!-- 생성일 -->
                                <td th:text="${#temporals.format(team.createdAt, 'yyyy.MM.dd')}">
                                    2024.01.01
                                </td>

                                <!-- 인원수 -->
                                <td th:text="${#lists.size(team.members)} + '명'">
                                    0명
                                </td>

                                <!-- 팀원 목록 -->
                                <td>
                                    <span th:each="member, stat : ${team.members}">
                                        <span class="member"
                                              th:text="${member.userName}">팀원</span>
                                        <span th:if="${!stat.last}">, </span>
                                    </span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- 푸터 -->
    <th:block th:replace="fragments/footer :: footer"></th:block>
</body>

</html>
